<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PSM Panel</title>
<style>
  body { font: 14px/1.6 system-ui, sans-serif; max-width: 960px; margin: 32px auto; padding: 0 16px; color: #0f172a }
  h1 { color: #059669 } table { border-collapse: collapse; width: 100% } td, th { border-bottom: 1px solid #e2e8f0; padding: 6px 8px; text-align: left }
  .err { color: #b91c1c } code { background: #f1f5f9; padding: 1px 4px; border-radius: 4px }
</style>
</head>
<body>
<h1>PSM Panel</h1>
<p>M0：打通 面板 → Worker → psm-api → psm 的链路。</p>
<div id="app">加载中…</div>
<script type="module">
const app = document.getElementById('app')
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch])
async function load() {
  const servers = await (await fetch('/api/servers')).json()
  if (!servers.length) { app.innerHTML = '<p>还没有服务器。</p>'; return }
  let html = ''
  for (const s of servers) {
    html += `<h2>${esc(s.name)} <small><code>${esc(s.api_url)}</code></small></h2>`
    const r = await fetch(`/api/servers/${s.id}/nodes`)
    const body = await r.json()
    if (!r.ok) { html += `<p class="err">${esc(body.error?.code)}: ${esc(body.error?.message)}</p>`; continue }
    // psm node list --json: { api_version, count, items: [ … ] }
    const nodes = body.items ?? []
    html += `<table><tr><th>内核</th><th>协议</th><th>名称</th><th>端口</th></tr>` +
      nodes.map((n) => `<tr><td>${esc(n.core)}</td><td>${esc(n.protocol)}</td><td>${esc(n.tag)}</td><td>${esc(n.port)}</td></tr>`).join('') +
      `</table>`
  }
  app.innerHTML = html
}
load().catch((e) => { app.innerHTML = `<p class="err">${esc(e)}</p>` })
</script>
</body>
</html>
